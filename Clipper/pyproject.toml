[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "1.0.0"
description = "ClipForge - AI Video Clipping & Repurposing Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.3",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "yt-dlp>=2026.10.26",
    "pip-system-certs>=5.3",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.9.0",
    "google-generativeai>=0.4.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "websockets>=12.0"
]
